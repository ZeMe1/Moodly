plugins {
    id 'com.google.devtools.ksp'
}

apply from: "$project.rootDir/gradle_scripts/java-version-android-library.gradle"

android {
    namespace = 'kz.zeme.moodly.core.note'
}

dependencies {
    implementation project(':core')
    implementation project(':core-di')
    implementation project(':core-error')
    implementation project(':core-observable')

    implementation moodlyLibs.bundles.koin
    implementation moodlyLibs.androidx.room
    implementation moodlyLibs.androidx.room.ktx
    ksp moodlyLibs.androidx.room.compiler
}
