plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    alias(moodlyTooling.plugins.compose.compiler)
    alias(moodlyTooling.plugins.kotlin.parcelize)
}

apply from: "$project.rootDir/gradle_scripts/environment-constants.gradle"

android {
    namespace = 'kz.zeme.moodly'
    compileSdk = moodlyLibs.versions.androidCompileSdkVersion.get().toInteger()

    defaultConfig {
        applicationId = "kz.zeme.moodly"
        minSdk = moodlyLibs.versions.androidMinSdkVersion.get().toInteger()
        targetSdk = moodlyLibs.versions.androidTargetSdkVersion.get().toInteger()
        versionCode = VERSION_CODE
        versionName = VERSION_NAME

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary = true
        }
    }

    addToManifest(android.defaultConfig, "APP_SCHEME", APP_SCHEME)

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
        debug {
            debuggable = true
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlin {
        jvmToolchain(17)
    }

    buildFeatures {
        compose = true
    }

    bundle {
        language {
            enableSplit = false
        }
    }
}

dependencies {
    coreLibraryDesugaring moodlyLibs.desugarJdk

    implementation project(':core')
    implementation project(':core-error')
    implementation project(':core-di')
    implementation project(':core-observable')
    implementation project(':core-res')
    implementation project(':core-activity')
    implementation project(':core-navigation')
    implementation project(':core-fragment')
    implementation project(':core-ui')
    implementation project(':core-locale')
    implementation project(':core-locale-view')
    implementation project(':core-theme')
    implementation project(':core-theme-view')
    implementation project(':core-note')
    implementation project(':note-list')
    implementation project(':note-create')
    implementation project(':note-detail')
    implementation project(':note-edit')
    implementation project(':emotions')
    implementation project(':emotions-list')
    implementation project(':settings')

    implementation moodlyLibs.androidx.core.ktx
    implementation moodlyLibs.androidx.appcompat
    implementation moodlyLibs.androidx.activity.ktx
    implementation moodlyLibs.androidx.fragment.ktx
    implementation moodlyLibs.material
    implementation moodlyLibs.androidx.lifecycle.runtime.ktx
    implementation moodlyLibs.androidx.lifecycle.livedata.ktx
    implementation moodlyLibs.androidx.lifecycle.viewmodel.ktx
    implementation moodlyLibs.bundles.koin

    implementation(platform(moodlyTooling.compose.bom))
    implementation moodlyTooling.bundles.compose
    implementation moodlyTooling.compose.livedata

    testImplementation moodlyLibs.junit
    androidTestImplementation(platform(moodlyTooling.compose.bom))
    androidTestImplementation moodlyTooling.compose.ui.test.junit4
    androidTestImplementation moodlyLibs.androidx.espresso.core
    androidTestImplementation moodlyLibs.androidx.junit
    debugImplementation moodlyTooling.compose.ui.test.manifest
    debugImplementation moodlyTooling.compose.ui.tooling
}
