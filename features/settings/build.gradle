android {
    namespace = 'kz.zeme.moodly.feature.settings'
}

dependencies {
    implementation project(':core')
    implementation project(':core-di')
    implementation project(':core-error')
    implementation project(':core-fragment')
    implementation project(':core-navigation')
    implementation project(':core-observable')
    implementation project(':core-res')
    implementation project(':core-ui')

    implementation project(':core-locale-view')
    implementation project(':core-theme-view')

    implementation moodlyLibs.bundles.koin
    implementation moodlyLibs.androidx.fragment.ktx
    implementation moodlyLibs.material
    implementation moodlyLibs.androidx.lifecycle.livedata.ktx
