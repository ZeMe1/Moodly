apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    buildFeatures {
        compose = true
    }
    defaultConfig {
        vectorDrawables {
            useSupportLibrary = true
        }
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation(platform(moodlyTooling.compose.bom))
    implementation moodlyTooling.bundles.compose
}
